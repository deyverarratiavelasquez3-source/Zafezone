# ============================================================
#  CONFIGURACIÓN DE ZAFEZONE CAS
#  Este es el ÚNICO archivo que hay que editar para poner en
#  marcha el proyecto. Guárdalo y luego ejecuta:
#       1) python crear_base_datos.py
#       2) python app.py
#  (No pongas comillas en los valores)
# ============================================================

[mysql]
# Dirección del servidor MySQL. Si MySQL está en el mismo computador: localhost
host = 127.0.0.1

# Puerto de MySQL (el normal es 3306)
puerto = 3306

# Usuario de MySQL
usuario = zafe

# Contraseña de MySQL (si no tiene contraseña, déjala vacía)
password = pepe729

# Nombre de la base de datos. Si no existe, se crea sola.
base_de_datos = zafezone_cas


[app]
# Puerto donde se abrirá la página web: http://localhost:5000
puerto_web = 5001

# Clave secreta para proteger las sesiones de los usuarios.
# CÁMBIALA por un texto largo y aleatorio. Para generar uno ejecuta:
#   python -c "import secrets; print(secrets.token_hex(32))"
clave_secreta = c24715890eb8e7a95739a48179837002fb4f0cb113060292e6e0325baa973ebb

# Modo desarrollo (muestra errores detallados). Pon "false" cuando
# la página ya esté publicada para el uso real.
debug = false


[admin]
# Cuenta del administrador (la persona que revisa las denuncias).
# Se crea al ejecutar crear_base_datos.py
nombre = admin
password = Admin1234
